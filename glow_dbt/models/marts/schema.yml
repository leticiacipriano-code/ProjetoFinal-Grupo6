models:

  - name: mart_unified_products
    
    columns:
      
      - name: product_type
        tests: 
          - not_null
      
      - name: brand
        tests: 
          - not_null
          - dbt_utils.not_null_proportion:
              at_least: 0.95
              config:
                severity: warn

      - name: product_name
        tests: 
          - not_null

      - name: price
        tests:
          - not_null
    
    tests:
      
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_name
            - brand

      - dbt_utils.expression_is_true:
          expression: "price >= 0"


  - name: mart_sales

    columns:
      
      - name: country
        tests:
          - not_null

      - name: product
        tests:
          - not_null

      - name: price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      
      - name: boxes_shipped
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: date
        tests:
          - not_null

      - name: sales_person
        tests:
          - not_null


  - name: mart_ingredient_pairs
    
    columns:
      
      - name: product_name
        tests:
          - not_null
          - relationships:
              to: ref('mart_unified_products')
              field: product_name

      - name: ing_1
        tests:
          - not_null

      - name: ing_2
        tests:
          - not_null

      - name: price_tier
        tests:
          - not_null
          - accepted_values:
              values: ['Budget', 'Mid-Ticket', 'Premium']


  - name: mart_pair_stats
    
    columns:
      
      - name: ing_1
        tests:
          - not_null

      - name: ing_2
        tests:
          - not_null

      - name: price_tier
        tests:
          - not_null
          - accepted_values:
              values: ['Budget', 'Mid-Ticket', 'Premium']

      - name: volume_produtos
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1

      - name: avg_rank
        tests:
          - not_null


  - name: mart_price_quartiles
    
    columns:
      
      - name: product_name
        tests:
          - not_null

      - name: price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: quartile
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]


  - name: mart_product_tiers
    
    columns:
      
      - name: product_name
        tests:
          - not_null

      - name: price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: price_tier
        tests:
          - not_null
          - accepted_values:
              values: ['Budget', 'Mid-Ticket', 'Premium']

      - name: product_rank
        tests:
          - not_null


  - name: mart_unnested_ingredients
    
    columns:
      
      - name: product_name
        tests:
          - not_null
          - relationships:
              to: ref('mart_unified_products')
              field: product_name

      - name: ingredient
        tests:
          - not_null

      - name: price_tier
        tests:
          - not_null
          - accepted_values:
              values: ['Budget', 'Mid-Ticket', 'Premium']