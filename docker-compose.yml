services:

  app:
    image: pipeline_elt_glow
    build: .
    container_name: g6
    command: uv run main.py
    volumes:
      - .:/app              
      - ./gx_docs:/app/gx_docs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database_network


  postgres:
    image: postgres:15
    container_name: glow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glow1234}
      POSTGRES_DB: ${POSTGRES_DB:-glow_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glow} -d ${POSTGRES_DB:-glow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - database_network
      - metabase_network


  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: always
    environment:
      MB_DB_FILE: /metabase-data/metabase
    volumes:
      - ./frontend/metabase_data:/metabase-data
    ports:
      - "3000:3000"
    networks:
      - metabase_network


  web-service:
    image: nginx:alpine
    container_name: static_gx
    volumes:
      - ./gx_docs/uncommitted/data_docs/local_site:/usr/share/nginx/html:ro
    ports:
      - "8080:80"


  elt-transformation:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    container_name: dbt
    working_dir: /usr/app/dbt_project
    entrypoint: /bin/sh -c "sleep infinity"
    env_file: .env
    volumes:
      - ./glow_dbt:/usr/app/dbt_project
      - ./profiles:/root/.dbt
    depends_on:
      - postgres
    networks:
      - database_network


  dbt-docs:
    image: nginx:alpine
    container_name: static_dbt
    volumes:
      - ./glow_dbt/target:/usr/share/nginx/html:ro
    ports:
      - "8181:80"
  


  airflow-common: &airflow-common
    image: apache/airflow:2.8.1
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-glow}:${POSTGRES_PASSWORD:-glow1234}@glow_postgres/airflow_db
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-} 
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - _PIP_ADDITIONAL_DEPENDENCIES=apache-airflow-providers-great-expectations dbt-postgres
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - ./glow_dbt:/usr/app/dbt_project
      - ./profiles:/root/.dbt
      - gx_docs:/app/gx_docs
    user: "${AIRFLOW_UID:-5000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database_network

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler

# --- DECLARAÇÃO DE VOLUMES ---
volumes:
  postgres_data:
    name: "postgres_data"
  gx_docs:
    name: "gx_docs"
  airflow_logs:
    name: "airflow_logs"
  airflow_plugins:
    name: "airflow_plugins"

# --- REDES ---
networks:
  database_network:
    driver: bridge
  metabase_network:
    driver: bridge